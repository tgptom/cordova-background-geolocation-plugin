name: CI

on:
  push:
    branches: [stable, main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - name: Install dependencies
        run: npm ci

      - name: Run lint and Android tests
        run: |
          npm run lint
          npm run test:android

      - name: Validate merged Android manifest generation
        run: |
          cd android
          ./gradlew :CDVBackgroundGeolocation:processDebugMainManifest --no-daemon
          test -f CDVBackgroundGeolocation/build/intermediates/merged_manifests/debug/AndroidManifest.xml

      - name: Run package checks
        run: npm run pack:check

      - name: Create capacitor app and build it
        run: | 
          npm init @capacitor/app temp -- --name temp --app-id temp.com
          cd temp
          npm ci
          npm i ../*.tgz
          npm install @capacitor/android
          npx cap add android
          npm run build
          npx cap sync
          echo "android.enableJetifier=true" >> ./android/gradle.properties
          awk 'NR==7 {print "    <string name=\"plugin_bgloc_account_name\">@string/app_name</string>";\
                      print "    <string name=\"plugin_bgloc_account_type\">temp</string>";\
                      print "    <string name=\"plugin_bgloc_content_authority\">@string/package_name</string>"}\
                      1' android/app/src/main/res/values/strings.xml > temp.xml && mv temp.xml android/app/src/main/res/values/strings.xml
          cd android
          ./gradlew assembleDebug

  ios-tests:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run iOS native tests
        run: npm run test:ios
